---
- name: Проверить, работает ли драйвер
  ansible.builtin.command: nvidia-smi
  register: nvidia_driver_smi_before
  changed_when: false
  failed_when: false

- name: Установить драйвер, если его нет
  when: nvidia_driver_smi_before.rc != 0
  block:
    - name: Установить ubuntu-drivers-common
      ansible.builtin.apt:
        name: ubuntu-drivers-common
        state: present

    - name: Установить серверный драйвер NVIDIA
      ansible.builtin.command: ubuntu-drivers install --gpgpu nvidia:{{ nvidia_driver_branch }}-server
      changed_when: true

    - name: Установить nvidia-smi
      ansible.builtin.apt:
        name: "nvidia-utils-{{ nvidia_driver_branch }}-server"
        state: present

    - name: Перезагрузить сервер, чтобы загрузился драйвер
      ansible.builtin.reboot:
        reboot_timeout: 900

- name: Запретить автообновление драйвера
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51-nvidia-no-unattended
    mode: "0644"
    content: |
      Unattended-Upgrade::Package-Blacklist {
          "nvidia-";
          "libnvidia-";
          "linux-modules-nvidia-";
      };

- name: Проверить драйвер после установки
  ansible.builtin.command: nvidia-smi -L
  register: nvidia_driver_smi_after
  changed_when: false

- name: Показать найденные видеокарты
  ansible.builtin.debug:
    var: nvidia_driver_smi_after.stdout_lines
