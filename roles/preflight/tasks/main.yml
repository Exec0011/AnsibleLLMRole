---
- name: Проверить, что ОС — Ubuntu 22.04 или 24.04
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] in ['22.04', '24.04']
    fail_msg: "Нужна Ubuntu 22.04 или 24.04"
    quiet: true

- name: Найти видеокарту NVIDIA на шине PCI
  ansible.builtin.shell: grep -lx 0x10de /sys/bus/pci/devices/*/vendor || true
  register: preflight_nvidia_pci
  changed_when: false
  check_mode: false

# В WSL видеокарта не видна на шине PCI: её отдаёт драйвер Windows,а внутри WSL лежит только его nvidia-smi
- name: Проверить, не WSL ли это с видеокартой
  ansible.builtin.stat:
    path: /usr/lib/wsl/lib/nvidia-smi
  register: preflight_wsl_nvidia_smi

# gpu_enabled и gpu_wsl - общие переменные: их читают site.yml и другие
# роли, поэтому без префикса роли
- name: Запомнить, есть ли GPU и не WSL ли это
  ansible.builtin.set_fact:
    gpu_enabled: "{{ preflight_nvidia_pci.stdout_lines | length > 0 or preflight_wsl_nvidia_smi.stat.exists }}"  # noqa: var-naming[no-role-prefix]
    gpu_wsl: "{{ preflight_wsl_nvidia_smi.stat.exists }}"  # noqa: var-naming[no-role-prefix]

- name: Показать режим работы
  ansible.builtin.debug:
    msg: >-
      Режим: {{ 'GPU' if gpu_enabled | bool else 'CPU (видеокарты нет)' }}{{
      ' в WSL, драйвер даёт Windows' if gpu_wsl | bool else '' }}
