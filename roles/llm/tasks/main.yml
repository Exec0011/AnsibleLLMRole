---
- name: Создать каталог для стека
  ansible.builtin.file:
    path: "{{ llm_dir }}"
    state: directory
    mode: "0750"

- name: Положить docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ llm_dir }}/docker-compose.yml"
    mode: "0640"

- name: Создать каталоги для nginx и сертификатов
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ llm_dir }}/nginx"
    - "{{ llm_dir }}/certs"

- name: Сгенерировать self-signed сертификат
  ansible.builtin.command: >-
    openssl req -x509 -nodes -newkey rsa:2048 -days 825
    -subj "/CN={{ inventory_hostname }}"
    -keyout {{ llm_dir }}/certs/tls.key
    -out {{ llm_dir }}/certs/tls.crt
  args:
    creates: "{{ llm_dir }}/certs/tls.crt"

- name: Закрыть доступ к ключу сертификата
  ansible.builtin.file:
    path: "{{ llm_dir }}/certs/tls.key"
    mode: "0600"

- name: Положить конфиг nginx
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ llm_dir }}/nginx/nginx.conf"
    mode: "0600"
  notify: Перечитать конфиг nginx

- name: Поднять стек
  community.docker.docker_compose_v2:
    project_src: "{{ llm_dir }}"
    state: present

- name: Применить новый конфиг nginx
  ansible.builtin.meta: flush_handlers

- name: Дождаться, пока Ollama начнёт отвечать
  ansible.builtin.uri:
    url: http://127.0.0.1:11434/api/version
  register: llm_health
  check_mode: false
  until: llm_health.status == 200
  retries: 30
  delay: 5

- name: Получить список скачанных моделей
  ansible.builtin.uri:
    url: http://127.0.0.1:11434/api/tags
  register: llm_tags
  check_mode: false
- name: Скачать модель {{ llm_model }}
  ansible.builtin.uri:
    url: http://127.0.0.1:11434/api/pull
    method: POST
    body_format: json
    body:
      model: "{{ llm_model }}"
      stream: false
    timeout: 1800
  changed_when: true
  when: llm_model not in (llm_tags.json.models | map(attribute='name') | list)
