<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Архитектура: GPU-сервер с LLM за API</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-gpu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1100" height="700" fill="#ffffff"/>

  <text x="40" y="38" font-size="22" font-weight="700" fill="#111827">GPU-сервер с LLM-моделью за API</text>

  <!-- ===== 1. Развёртывание ===== -->
  <text x="40" y="70" font-size="15" font-weight="700" fill="#111827">1. Развёртывание (Ansible)</text>

  <rect x="40" y="82" width="220" height="66" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="56" y="108" font-size="14" font-weight="600" fill="#111827">Рабочая машина</text>
  <text x="56" y="130" font-size="12" font-family="Consolas, Menlo, monospace" fill="#374151">ansible-playbook site.yml</text>

  <line x1="260" y1="115" x2="322" y2="115" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="276" y="106" font-size="12" fill="#6b7280">SSH</text>

  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#111827">
    <rect x="326" y="96" width="80" height="38" rx="19" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="366" y="119" text-anchor="middle">preflight</text>

    <rect x="420" y="96" width="60" height="38" rx="19" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="450" y="119" text-anchor="middle">base</text>

    <rect x="494" y="96" width="110" height="38" rx="19" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="5 4"/>
    <text x="549" y="119" text-anchor="middle">nvidia_driver</text>

    <rect x="618" y="96" width="185" height="38" rx="19" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="5 4"/>
    <text x="710" y="119" text-anchor="middle">nvidia_container_toolkit</text>

    <rect x="817" y="96" width="70" height="38" rx="19" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="852" y="119" text-anchor="middle">docker</text>

    <rect x="901" y="96" width="50" height="38" rx="19" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="926" y="119" text-anchor="middle">llm</text>

    <rect x="965" y="96" width="95" height="38" rx="19" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="1012" y="119" text-anchor="middle">smoke_test</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.4" fill="none">
    <path d="M409,110 L415,115 L409,120"/>
    <path d="M483,110 L489,115 L483,120"/>
    <path d="M607,110 L613,115 L607,120"/>
    <path d="M806,110 L812,115 L806,120"/>
    <path d="M890,110 L896,115 L890,120"/>
    <path d="M954,110 L960,115 L954,120"/>
  </g>
  <text x="326" y="160" font-size="12" fill="#6b7280">Роли выполняются по порядку; повторный запуск ничего не меняет (changed=0)</text>

  <!-- ===== 2. Запрос ===== -->
  <text x="40" y="202" font-size="15" font-weight="700" fill="#111827">2. Как идёт запрос</text>

  <!-- Клиент -->
  <rect x="30" y="330" width="150" height="90" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="44" y="358" font-size="14" font-weight="600" fill="#111827">Клиент</text>
  <text x="44" y="380" font-size="12" fill="#374151">curl, OpenAI SDK,</text>
  <text x="44" y="398" font-size="12" fill="#374151">любой клиент</text>

  <!-- Сервер -->
  <rect x="260" y="212" width="800" height="430" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
  <text x="280" y="238" font-size="14" font-weight="600" fill="#111827">GPU-сервер · Ubuntu 22.04 / 24.04</text>

  <!-- Docker Compose -->
  <rect x="285" y="252" width="750" height="258" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="300" y="275" font-size="12" font-weight="600" fill="#6b7280">Docker Compose · /opt/llm</text>

  <!-- nginx -->
  <rect x="310" y="295" width="280" height="160" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="326" y="322" font-size="14" font-weight="700" fill="#1e3a8a">llm-gateway · nginx</text>
  <text x="326" y="342" font-size="12" fill="#1e40af">:443 HTTPS — единственный вход</text>
  <g font-size="13" fill="#1f2937">
    <text x="326" y="372">• нет токена Bearer → 401</text>
    <text x="326" y="396">• путь не /v1/* → 404</text>
    <text x="326" y="420">• больше 10 запр/с на токен → 429</text>
  </g>
  <text x="326" y="443" font-size="11" fill="#6b7280">токен не уходит в модель и в логи</text>
  <text x="310" y="482" font-size="11" fill="#6b7280">токены — из ansible-vault, конфиг nginx с правами 0600</text>

  <!-- Клиент → nginx -->
  <line x1="180" y1="375" x2="306" y2="375" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="188" y="366" font-size="11" fill="#374151">HTTPS</text>
  <text x="188" y="393" font-size="11" fill="#374151">+ токен</text>

  <!-- nginx → Ollama -->
  <line x1="590" y1="375" x2="696" y2="375" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="643" y="366" font-size="11" font-family="Consolas, Menlo, monospace" fill="#374151" text-anchor="middle">ollama:11434</text>

  <!-- Ollama -->
  <rect x="700" y="295" width="300" height="160" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="716" y="322" font-size="14" font-weight="700" fill="#14532d">llm-backend · Ollama</text>
  <text x="716" y="342" font-size="12" fill="#166534">127.0.0.1:11434 — снаружи закрыт</text>
  <g font-size="13" fill="#1f2937">
    <text x="716" y="372">• модель из group_vars (llm_model)</text>
    <text x="716" y="396">• API в формате OpenAI: /v1/...</text>
    <text x="716" y="420">• healthcheck, restart: unless-stopped</text>
  </g>
  <text x="716" y="443" font-size="11" fill="#6b7280">модель держится в памяти (KEEP_ALIVE=-1)</text>

  <!-- Том -->
  <line x1="895" y1="455" x2="895" y2="464" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="800" y="464" width="200" height="38" rx="8" fill="#ffffff" stroke="#16a34a" stroke-dasharray="3 3"/>
  <text x="900" y="481" font-size="12" font-weight="600" fill="#14532d" text-anchor="middle">том ollama-models</text>
  <text x="900" y="496" font-size="10" fill="#6b7280" text-anchor="middle">веса модели не теряются</text>

  <!-- Ollama → GPU -->
  <line x1="725" y1="455" x2="725" y2="528" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-gpu)"/>
  <text x="733" y="492" font-size="11" fill="#6d28d9">GPU</text>

  <!-- Драйвер + toolkit -->
  <rect x="285" y="532" width="470" height="52" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="5 4"/>
  <text x="301" y="554" font-size="13" font-weight="600" fill="#4c1d95">Драйвер NVIDIA 580-server + Container Toolkit</text>
  <text x="301" y="573" font-size="11" fill="#6d28d9">драйвер на хосте, CUDA в образе, toolkit пробрасывает GPU в контейнер</text>

  <line x1="755" y1="558" x2="786" y2="558" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-gpu)"/>

  <!-- GPU -->
  <rect x="790" y="532" width="245" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="912" y="563" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">NVIDIA GPU</text>

  <text x="285" y="618" font-size="11" fill="#6b7280">Docker: образы через зеркало mirror.gcr.io, ротация логов 3 × 50 МБ, live-restore — контейнеры живут при перезапуске Docker</text>

  <!-- Легенда -->
  <rect x="40" y="664" width="34" height="16" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="5 4"/>
  <text x="84" y="677" font-size="12" fill="#374151">— только если на сервере найдена видеокарта NVIDIA (без неё стек работает на CPU)</text>
</svg>
